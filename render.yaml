services:
  - type: web
    name: AnnieXMusic
    plan: standard  # REQUIRED - free tier insufficient
    runtime: python
    buildCommand: |
        pip install -r requirements.txt
    startCommand: python3 -m ANNIEMUSIC
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: 1
    healthCheckPath: /
    healthCheckTimeoutSeconds: 45
