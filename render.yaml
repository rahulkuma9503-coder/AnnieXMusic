services:
  - type: web
    name: AnnieXMusic
    plan: standard  # Free tier has only 512MB RAM [citation:1]
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m ANNIEMUSIC
    envVars:
      - key: PORT
        value: 10000  # Render's default port [citation:3]
    healthCheckPath: /
    healthCheckTimeoutSeconds: 45  # Increased timeout [citation:1]
